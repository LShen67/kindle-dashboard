name: Update dashboard
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may run it a little late)
  workflow_dispatch:          # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install pillow
      - run: python render.py
      - name: Commit new image
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add dashboard.png
          git commit -m "Update dashboard" || echo "No change"
          git push
